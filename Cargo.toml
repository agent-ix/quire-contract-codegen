[package]
name = "quire-contract-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic Rust, property-test, proof, and evidence generation from Quire contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-codegen"

[lib]
name = "quire_contract_codegen"
path = "src/lib.rs"

# Explicit so `test = true` can be set: this is what lets `cargo test` run the
# `#[cfg(test)] mod tests` declared inside the example (issue #125). Edition
# 2021 keeps autodiscovery on for every other target even with one example
# declared explicitly here -- there is currently exactly one file under
# examples/, so there is nothing else to discover either way; verified with
# `cargo metadata` after adding this section.
[[example]]
name = "generation_conformance"
path = "examples/generation_conformance.rs"
test = true

[dependencies]
quire-contract-ir = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "dfd8bd7812a571ba1f19505374460efef4a473bc" }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", rev = "4e330525be513fe57c67717dc22b969d36656b85", features = ["exact"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", rev = "4e330525be513fe57c67717dc22b969d36656b85", features = ["proptest", "exact"] }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "21c507e50cb009497ee9d306e1d18c1919346611" }

[profile.release]
lto = "thin"
codegen-units = 1
