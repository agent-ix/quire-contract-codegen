[package]
name = "quire-contract-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic Rust, property-test, proof, and evidence generation from Quire contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/quire-contract-codegen"

[lib]
name = "quire_contract_codegen"
path = "src/lib.rs"

[dependencies]
quire-contract-ir = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "04eb6f849c03be23177d373549c6c272551f957d" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full"] }

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", rev = "8a4d02b9ff4633cf6d02fd8bdf6ee1b11ad76354", features = ["proptest"] }

[profile.release]
lto = "thin"
codegen-units = 1
