[package]
name = "quire-contract-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic Rust, property-test, proof, and evidence generation from Quire contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/quire-contract-codegen"

[lib]
name = "quire_contract_codegen"
path = "src/lib.rs"

[dependencies]
quire-contract-ir = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "5c49ebfd1c87415f74420ad047392bd03b1bd202" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full"] }

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", rev = "e360dad8a3e0e54f9b8457ff7f3748be0f2acdb3", features = ["proptest"] }

[profile.release]
lto = "thin"
codegen-units = 1
