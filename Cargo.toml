[package]
name = "quire-contract-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic Rust, property-test, proof, and evidence generation from Quire contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-codegen"

[lib]
name = "quire_contract_codegen"
path = "src/lib.rs"

[dependencies]
quire-contract-ir = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", branch = "main" }
# The model items (`CheckedPackageV2`, `RequirementRef`, ...) come from quire-contract-model, a crate in
# the same repository and the same lock entry as quire-contract-ir; the IR root crate is named only
# for its `kani` module (IR AD-006 R3-C2).
quire-contract-model = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", branch = "main" }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", branch = "main", features = ["exact"] }
# qsl-replay is the only QSL crate this repository depends on (QSL arch-lint T12-A); the
# replay adapter in src/replay/function.rs builds its requests from `call_site` and the crate's own
# re-exports and goes through its `replay` entry. It tracks QSL `main`; Cargo.lock records the commit.
qsl-replay = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "process", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", branch = "main", features = ["proptest", "exact"] }
# The home of the checked-operation catalog Contract IR validates against; tests select law
# definitions from it instead of copying them.
quire-verification-contracts = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-verification-contracts", branch = "main" }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
