[package]
name = "quire-contract-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic Rust, property-test, proof, and evidence generation from Quire contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-codegen"

[lib]
name = "quire_contract_codegen"
path = "src/lib.rs"

# Explicit so `test = true` can be set: this is what lets `cargo test` run the
# `#[cfg(test)] mod tests` declared inside the example (issue #125). Edition
# 2021 keeps autodiscovery on for every other target even with one example
# declared explicitly here -- there is currently exactly one file under
# examples/, so there is nothing else to discover either way; verified with
# `cargo metadata` after adding this section.
[[example]]
name = "generation_conformance"
path = "examples/generation_conformance.rs"
test = true

[dependencies]
quire-contract-ir = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "b52c26380cb312e6005474d70ba2b88a37246ffe" }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", rev = "c52442a56a879cb5ce02a63bcbe430b85bf74a6d", features = ["exact"] }
# IR-254: qsl-replay is the only QSL crate this repository may depend on (QSL arch-lint
# T12-A). It stays a normal dependency, not a dev-dependency, because both IR-254 (this pin
# cascade) and QSL-22 (the replay adapter it pins to) need it available outside tests: no
# code in src/ calls it yet, but the three-way agreement authority leg (FR-014-AC-6,
# FR-018-AC-2) this pin exists to reach is planned to, from src/, not only from tests.
qsl-replay = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "daa0178b0ab82b6e1dc4a7868044d2596ec51374" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
quire-contract-runtime = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-runtime", rev = "c52442a56a879cb5ce02a63bcbe430b85bf74a6d", features = ["proptest", "exact"] }

[profile.release]
lto = "thin"
codegen-units = 1
