[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Reached through the operation catalog's home: `borrow-or-share` (MIT-0) via
    # `fluent-uri`. Permissive and compatible with AGPL-3.0-or-later.
    "MIT-0",
    # `ar_archive_writer` (a build dependency of `stacker`, reached through the IR
    # and QSL dependencies). Apache-2.0 plus LLVM's standard exception; still permissive.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9
# First-party agent-ix crates are AGPL-3.0-or-later (owner decision 2026-09-14,
# agent-ix/quire-contract-codegen#45). Exceptions are scoped to this crate and the
# sibling quire-contract-* crates it consumes so the third-party allow-list stays
# permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-codegen" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-ir" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-model" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-runtime" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-observation" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-protocol" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-verification-contracts" },
    # quire-spec-language is reached through quire-contract-ir and quire-protocol and
    # declares AGPL-3.0-or-later, the same first-party decision as above.
    { allow = ["AGPL-3.0-or-later"], crate = "quire-spec-language" },
    { allow = ["AGPL-3.0-only"], crate = "agent-ix-baseline-producer" },
    # IR-254: qsl-replay (the only QSL crate this repository may depend on, per
    # QSL arch-lint T12-A) and its own transitive closure -- all first-party
    # agent-ix crates under the same AGPL-3.0-or-later decision above.
    { allow = ["AGPL-3.0-or-later"], crate = "qsl-cst" },
    { allow = ["AGPL-3.0-or-later"], crate = "qsl-eval" },
    { allow = ["AGPL-3.0-or-later"], crate = "qsl-forms" },
    { allow = ["AGPL-3.0-or-later"], crate = "qsl-foundation" },
    { allow = ["AGPL-3.0-or-later"], crate = "qsl-package" },
    { allow = ["AGPL-3.0-or-later"], crate = "qsl-replay" },
    { allow = ["AGPL-3.0-or-later"], crate = "qsl-semantics" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-exact" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-rs" },
    { allow = ["AGPL-3.0-or-later"], crate = "agent-ix-extraction-frontend" },
    { allow = ["AGPL-3.0-or-later"], crate = "agent-ix-semantic-ir" },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2
# RUSTSEC-2026-0009 is in `time`, reached through jsonschema; it is reachable only through an
# unused RFC-2822 parser.
ignore = ["RUSTSEC-2026-0009"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Every first-party agent-ix repository the resolved graph actually reaches. The
# list is the whole point of the check: a git source outside it is an unreviewed
# dependency and fails. Listing only two of the eight made `sources` red on every
# run, which is the same as not checking at all.
allow-git = [
    "https://github.com/agent-ix/filament-core-data",
    "https://github.com/agent-ix/quire-canonical",
    "https://github.com/agent-ix/quire-contract-ir",
    "https://github.com/agent-ix/quire-contract-runtime",
    "https://github.com/agent-ix/quire-observation",
    "https://github.com/agent-ix/quire-protocol",
    "https://github.com/agent-ix/quire-rs",
    "https://github.com/agent-ix/quire-spec-language",
    "https://github.com/agent-ix/quire-verification-contracts",
    "https://github.com/agent-ix/tl-mltl",
    "https://github.com/agent-ix/tl-syntax",
]
