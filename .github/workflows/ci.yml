name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out authoritative QSpec fixtures
        uses: actions/checkout@v4
        with:
          repository: agent-ix/quire-specification
          path: quire-specification

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
        env:
          QSPEC_DIR: ${{ github.workspace }}/quire-specification

      - name: Minimum supported Rust version
        run: make msrv

      - name: Validate specification
        run: |
          npm install --global '@agent-ix/quire-cli' '@agent-ix/quoin'
          quoin module ensure-defaults
          quire validate --scope . 'spec/**/*.md' 'plan/**/*.md' 'reviews/**/*.md'

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses
