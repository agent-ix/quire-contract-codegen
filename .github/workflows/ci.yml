name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Check out authoritative QSpec fixture source
        run: git clone --no-checkout https://github.com/agent-ix/quire-specification.git "$RUNNER_TEMP/quire-specification"

      - name: Test
        run: cargo test
        env:
          QSPEC_REPO: ${{ runner.temp }}/quire-specification

      - name: Rust 1.98.1 compatibility
        run: cargo +1.98.1 check --locked --all-targets --message-format=json

      - name: Validate specification
        run: |
          npm install --global '@agent-ix/quire-cli' '@agent-ix/quoin'
          quoin module ensure-defaults
          quire validate --scope . 'spec/**/*.md' 'plan/**/*.md' 'reviews/**/*.md'

      - name: Unsafe audit
        # The selftest runs first and in this job, not only under
        # `make audit-unsafe`: this workflow invokes the scripts directly, so a
        # selftest wired only into the Makefile would never run here -- exactly
        # the blind spot #119 exists to close.
        run: |
          bash scripts/test_check_unsafe_comments.sh
          bash scripts/check_unsafe_comments.sh

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses
